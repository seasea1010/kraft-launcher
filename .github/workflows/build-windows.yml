name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        working-directory: kraft_launcher
        run: flutter build windows --release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: kraft-launcher-windows
          path: kraft_launcher/build/windows/x64/runner/Release/
